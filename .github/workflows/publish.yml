name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Marketplace publisher ID; falls back to VSCE_PUBLISHER or fairyan
        required: false
        type: string
        default: ''
      dry_run:
        description: Package only; do not publish to Marketplace
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Set Marketplace publisher
        env:
          INPUT_PUBLISHER: ${{ inputs.publisher }}
          VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
        run: |
          publisher="$INPUT_PUBLISHER"
          if [ -z "$publisher" ]; then publisher="$VSCE_PUBLISHER"; fi
          if [ -z "$publisher" ]; then publisher="fairyan"; fi
          echo "Using Marketplace publisher: $publisher"
          npm pkg set publisher="$publisher"

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: splash-model-provider-vsix
          path: build/splash-model-provider.vsix

      - name: Publish with PAT
        if: env.VSCE_PAT != '' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --skip-duplicate --githubBranch main

      - name: Publish with OIDC
        if: env.VSCE_PAT == '' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --skip-duplicate --oidc --githubBranch main
